<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Bán Sản Phẩm - Nexora Partner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/core/global.css">
    <link rel="stylesheet" href="/services/seller/seller.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container py-5">
        <div class="bg-surface border rounded-4 p-4 shadow-sm mx-auto" style="max-width: 720px;">
            <h3 class="fw-bold text-nvidia mb-4">📦 Đăng Bán Sản Phẩm Mới Lên Sàn</h3>
            <form id="createProductForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Tên sản phẩm</label>
                    <input type="text" id="prodName" class="form-control" placeholder="VD: Card đồ họa NVIDIA GeForce RTX 4070 Super 12GB" required>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Danh mục</label>
                        <select id="prodCategory" class="form-select">
                            <option value="gpu">Card đồ họa (GPU)</option>
                            <option value="cpu">Vi xử lý (CPU)</option>
                            <option value="mainboard">Mainboard</option>
                            <option value="ram">RAM &amp; SSD</option>
                            <option value="monitor">Màn hình</option>
                            <option value="headphones">Tai nghe</option>
                            <option value="keyboard">Bàn phím</option>
                            <option value="mouse">Chuột</option>
                            <option value="fashion">Balo &amp; Phụ kiện</option>
                            <option value="home_living">Đèn &amp; Gia dụng</option>
                            <option value="health_care">Chăm sóc sức khỏe</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Giá bán niêm yết (VNĐ)</label>
                        <input type="number" id="prodPrice" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Giá gốc (VNĐ)</label>
                        <input type="number" id="prodOldPrice" class="form-control" value="0">
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Số lượng kho</label>
                        <input type="number" id="prodStock" class="form-control" value="50" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Đơn vị tính</label>
                        <input type="text" id="prodUnit" class="form-control" value="Chiếc">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Cam kết Bảo hành</label>
                        <input type="text" id="prodWarranty" class="form-control" value="36 tháng Chính hãng">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Nhãn giảm giá</label>
                        <input type="text" id="prodBadge" class="form-control" placeholder="VD: -25%">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Ảnh Cover Sản Phẩm (Tải file ảnh)</label>
                    <input type="file" id="prodImage" class="form-control" accept="image/*">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" id="prodFlashSale" class="form-check-input">
                    <label class="form-check-label fw-semibold" for="prodFlashSale">⚡ Đưa vào mục Flash Sale trên Trang chủ</label>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Mô tả chi tiết &amp; Chính sách bảo hành minh bạch</label>
                    <textarea id="prodDesc" class="form-control" rows="4" required></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" id="submitProdBtn" class="btn btn-nvidia px-4 fw-bold">✅ Xác Nhận Đăng Bán</button>
                    <a href="/services/seller/seller-dashboard.html" class="btn btn-outline-secondary">Quay lại Dashboard</a>
                </div>
            </form>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/core/main.js"></script>
    <script src="/services/seller/seller.js"></script>
</body>
</html>
